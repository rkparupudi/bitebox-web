# Builds the web app and publishes it to S3 behind CloudFront. Runs after CI passes on main,
# or by hand. Skips itself until the repository variables are set (see the API repo's DEPLOYMENT.md).
#
# Repository variables:
#   AWS_DEPLOY_ROLE_ARN         IAM role GitHub assumes via OIDC
#   WEB_BUCKET                  S3 bucket name, e.g. bitebridge-web-prod
#   CLOUDFRONT_DISTRIBUTION_ID  e.g. E1ABCDEF2GHIJK
#   VITE_API_URL                public API URL, e.g. https://api.yourdomain.com
name: Deploy Web
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      # Hashed assets can be cached forever; index.html must always be re-checked so
      # users pick up a new release immediately.
      - name: Upload to S3
        run: |
          aws s3 sync dist/ "s3://${{ vars.WEB_BUCKET }}/" --delete \
            --exclude index.html --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/index.html "s3://${{ vars.WEB_BUCKET }}/index.html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/index.html"
